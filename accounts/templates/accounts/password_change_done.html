{% extends 'accounts/base.html' %}

{% block content %}
<div class="password-change-done-container">
    <div class="password-change-done-card">
        <div class="card-header">
            <h2>Password Changed</h2>
        </div>
        <div class="card-body">
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <p>Your password has been successfully changed.</p>
                <a href="{% url 'profile' %}" class="btn btn-primary">Back to Profile</a>
            </div>
        </div>
    </div>
</div>

<style>
    .password-change-done-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    
    .password-change-done-card {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    
    .password-change-done-card .card-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: white;
        padding: 1.5rem;
        text-align: center;
    }
    
    .password-change-done-card .card-body {
        padding: 2rem;
        text-align: center;
    }
    
    .success-message i {
        font-size: 3rem;
        color: #28a745;
        margin-bottom: 1rem;
    }
    
    .success-message p {
        font-size: 1.1rem;
        margin-bottom: 1.5rem;
    }
</style>
{% endblock %}
